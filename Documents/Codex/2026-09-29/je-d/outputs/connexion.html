<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080d0f"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
  <meta name="description" content="Connectez-vous à votre espace THE PEAK ou créez votre compte client.">
  <title>Connexion & création de compte — THE PEAK</title>
  <link rel="stylesheet" href="assets/service-pages.css">
  <style>
    body{min-height:100vh;background:#080d0f}.auth-shell{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.auth-visual{min-height:100vh;position:relative;overflow:hidden;background:#07131e}.auth-visual video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.62}.auth-visual:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#07131e25 0%,#07131e32 35%,#07131eef 100%)}.auth-brand{position:absolute;z-index:1;left:clamp(25px,5vw,76px);top:34px}.auth-brand img{width:160px}.auth-message{position:absolute;z-index:1;left:clamp(25px,5vw,76px);right:40px;bottom:clamp(45px,8vh,100px);color:white}.auth-kicker{color:#ff9955;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}.auth-message h1{font:700 clamp(46px,6vw,78px)/.91 var(--display);letter-spacing:-.03em;margin:18px 0}.auth-message p{max-width:490px;color:#d9e0e5;font-size:14px;line-height:1.8}.auth-right{display:flex;align-items:center;justify-content:center;padding:110px 34px 55px;background:#f6f7f8}.auth-card{width:min(100%,460px)}.auth-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:45px}.auth-top img{width:132px;filter:brightness(.12)}.auth-top a{font-size:11px;color:#5e6973}.auth-top a:hover{color:var(--orange)}.auth-title{font:700 clamp(36px,4vw,52px)/.98 var(--display);color:var(--blue);margin:0 0 12px}.auth-subtitle{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:27px}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #d7dde1;margin-bottom:25px}.auth-tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:13px 8px;color:#7b858d;font:600 12px var(--body);cursor:pointer}.auth-tabs button.active{border-color:var(--orange);color:var(--blue)}.auth-form[hidden],.auth-message-status[hidden]{display:none!important}.auth-form{display:grid;gap:15px}.auth-fields-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.auth-field{display:grid;gap:7px}.auth-field label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#52606a}.auth-field input{width:100%;padding:13px 2px;border:0;border-bottom:1px solid #cbd3d9;background:transparent;font:14px var(--body);color:#101820}.auth-field input:focus{outline:0;border-color:var(--orange)}.auth-actions{display:flex;justify-content:flex-end}.auth-actions button,.auth-link-button{padding:0;border:0;background:none;color:#64717c;font:500 11px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}.auth-submit{width:100%;margin-top:7px;border:0;cursor:pointer}.auth-submit:disabled{opacity:.6;cursor:wait}.auth-divider{display:flex;align-items:center;gap:14px;color:#89939a;font-size:10px;margin:20px 0}.auth-divider:before,.auth-divider:after{content:"";height:1px;background:#dce1e4;flex:1}.auth-contact{text-align:center;font-size:11px;color:#63707a;line-height:1.8}.auth-contact a{color:var(--blue);text-decoration:underline;text-underline-offset:3px}.auth-notice{margin:14px 0 0;font-size:11px;color:#78838b;line-height:1.6}.auth-status{min-height:22px;margin:4px 0;color:var(--blue);font-size:12px;line-height:1.6}.auth-status.error{color:#a33a25}.auth-status.success{color:#216346}.verify-panel{padding:18px 20px;margin:0 0 20px;border-left:3px solid var(--orange);background:white;color:var(--muted);font-size:12px;line-height:1.7}.auth-footer{margin-top:25px;color:#89939a;font-size:10px;text-align:center}.auth-footer a{color:var(--blue);text-decoration:underline}@media(max-width:800px){.auth-shell{grid-template-columns:1fr}.auth-visual{min-height:250px;height:31vh;max-height:340px}.auth-message{left:24px;bottom:23px}.auth-message h1{font-size:clamp(32px,7vw,48px);margin:10px 0}.auth-message p{display:none}.auth-brand{left:24px;top:20px}.auth-brand img{width:128px}.auth-right{padding:36px 24px 45px}.auth-top{margin-bottom:30px}.auth-top img{display:none}}@media(max-width:420px){.auth-fields-2{grid-template-columns:1fr}.auth-visual{min-height:225px}.auth-right{padding-inline:20px}}
  </style>
<link rel="stylesheet" href="assets/responsive.css"></head>
<body>
<main class="auth-shell">
  <section class="auth-visual" aria-label="THE PEAK, construire la suite"><video autoplay muted playsinline loop preload="metadata" aria-hidden="true"><source src="peak-hero.mp4" type="video/mp4"></video><a class="auth-brand" href="index.html" aria-label="THE PEAK, accueil"><img src="the-peak-logo.png" alt="THE PEAK"></a><div class="auth-message"><div class="auth-kicker">Votre espace THE PEAK</div><h1>Construire<br>la suite.</h1><p>Retrouvez les échanges et les ressources liés à votre accompagnement.</p></div></section>
  <section class="auth-right"><div class="auth-card"><div class="auth-top"><a href="index.html" aria-label="Retour à l’accueil"><img src="the-peak-logo.png" alt="THE PEAK"></a><a href="index.html">← Retour au site</a></div>
    <h2 class="auth-title" id="auth-title">Ravi de vous revoir.</h2><p class="auth-subtitle" id="auth-subtitle">Connectez-vous à votre espace client.</p>
    <div class="verify-panel" id="verify-panel" hidden aria-live="polite"></div>
    <div class="auth-tabs" role="tablist" aria-label="Connexion ou inscription"><button type="button" class="active" id="tab-login" role="tab" aria-selected="true">Connexion</button><button type="button" id="tab-register" role="tab" aria-selected="false">Créer un compte</button></div>
    <form class="auth-form" id="login-form" autocomplete="on"><div class="auth-field"><label for="login-email">E-mail professionnel</label><input id="login-email" name="email" type="email" autocomplete="username" required maxlength="255"></div><div class="auth-field"><label for="login-password">Mot de passe</label><input id="login-password" name="password" type="password" autocomplete="current-password" required minlength="8"></div><div class="auth-actions"><button class="auth-link-button" id="forgot-open" type="button">Mot de passe oublié ?</button></div><button class="btn auth-submit" type="submit">Se connecter <span class="arrow">↗</span></button></form>
    <form class="auth-form" id="register-form" autocomplete="on" hidden><div class="auth-fields-2"><div class="auth-field"><label for="register-first">Prénom</label><input id="register-first" name="prenom" autocomplete="given-name" maxlength="100" required></div><div class="auth-field"><label for="register-last">Nom</label><input id="register-last" name="nom" autocomplete="family-name" maxlength="155" required></div></div><div class="auth-field"><label for="register-email">Adresse e-mail</label><input id="register-email" name="email" type="email" autocomplete="email" required maxlength="255"></div><div class="auth-field"><label for="register-password">Mot de passe · 8 caractères minimum</label><input id="register-password" name="password" type="password" autocomplete="new-password" required minlength="8"></div><div class="auth-field"><label for="register-confirm">Confirmer le mot de passe</label><input id="register-confirm" name="confirm" type="password" autocomplete="new-password" required minlength="8"></div><label class="auth-notice"><input type="checkbox" name="terms" value="yes" required> J’accepte les <a href="legal.html#conditions">conditions d’utilisation</a> et la <a href="legal.html#confidentialite">politique de confidentialité</a>.</label><button class="btn auth-submit" type="submit">Créer mon compte <span class="arrow">↗</span></button></form>
    <form class="auth-form" id="forgot-form" hidden><div class="auth-field"><label for="forgot-email">Adresse e-mail du compte</label><input id="forgot-email" name="email" type="email" autocomplete="email" required maxlength="255"></div><button class="btn auth-submit" type="submit">Recevoir un lien de réinitialisation <span class="arrow">↗</span></button><div class="auth-actions"><button class="auth-link-button" id="forgot-cancel" type="button">Retour à la connexion</button></div></form>
    <p class="auth-status" id="auth-status" role="status" aria-live="polite"></p><div class="auth-divider">BESOIN D’AIDE ?</div><p class="auth-contact"><a href="https://wa.me/22369656610?text=Bonjour%20THE%20PEAK%2C%20j%E2%80%99ai%20besoin%20d%E2%80%99aide%20avec%20mon%20espace%20client." target="_blank" rel="noopener noreferrer">Contacter l’équipe sur WhatsApp</a><br><a href="mailto:contact@africademia.com?subject=Aide%20espace%20client">contact@africademia.com</a></p><div class="auth-footer">THE PEAK · <a href="legal.html#confidentialite">Confidentialité</a></div>
  </div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="assets/supabase-config.js"></script><script src="assets/supabase-client.js"></script><script src="assets/auth.js" defer></script>
</body></html>
